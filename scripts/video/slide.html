<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video scene</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050506; color: #f5f5f7;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse 1200px 700px at 50% 0%, rgba(90,110,255,.22), rgba(5,5,6,0) 70%); }
  .shot { position: absolute; left: 50%; top: 56px; width: 1504px; height: 846px; margin-left: -752px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.7); }
  .shot img { display: block; width: 100%; height: 100%; }
  .cap { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; }
  .cap h1 { font-size: 50px; font-weight: 800; letter-spacing: -.02em; }
  .cap p { margin-top: 10px; font-size: 28px; color: rgba(245,245,247,.7); }
  .card { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; }
  .card .k { font-size: 26px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(245,245,247,.6); }
  .card h1 { margin-top: 24px; font-size: 128px; font-weight: 800; letter-spacing: -.04em; }
  .card p { margin-top: 26px; font-size: 38px; color: rgba(245,245,247,.75); }
  .term { display: inline-block; margin-top: 46px; padding: 30px 46px; border-radius: 20px; background: #16161a; text-align: left;
    box-shadow: 0 0 0 1px rgba(255,255,255,.1); font: 500 36px/1.7 "SF Mono", Menlo, monospace; }
  .term .c { color: rgba(245,245,247,.45); }
  .term .p { color: #30d158; }
</style>
</head>
<body>
<div class="glow"></div>
<div id="root"></div>
<script>
  // Hash parameters: #kind=shot|card&img=…&t=title&s=subtitle&k=kicker&l=line1|line2 (lines starting with # are comments)
  var q = {};
  location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  var root = document.getElementById('root');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  if (q.kind === 'shot') {
    var f = el('div', 'shot'), img = el('img'); img.src = q.img; f.appendChild(img); root.appendChild(f);
    var c = el('div', 'cap'); c.appendChild(el('h1', '', q.t)); if (q.s) c.appendChild(el('p', '', q.s)); root.appendChild(c);
  } else {
    var d = el('div', 'card');
    if (q.k) d.appendChild(el('div', 'k', q.k));
    d.appendChild(el('h1', '', q.t));
    if (q.s) d.appendChild(el('p', '', q.s));
    if (q.l) {
      var t = el('div', 'term');
      q.l.split('|').forEach(function (line) {
        var row = el('div');
        if (line.charAt(0) === '#') row.appendChild(el('span', 'c', line));
        else { row.appendChild(el('span', 'p', '$ ')); row.appendChild(document.createTextNode(line)); }
        t.appendChild(row);
      });
      d.appendChild(t);
    }
    root.appendChild(d);
  }
</script>
</body>
</html>
