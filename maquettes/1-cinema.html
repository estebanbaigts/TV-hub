<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Maquette 1 — Cinéma</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: #000; color: #f5f5f7; }

  /* Illustration plein cadre, fondue vers le noir à gauche et en bas */
  .hero-art { position: absolute; top: 0; left: 0; right: 0; height: 860px; }
  .hero-mask {
    position: absolute; top: 0; left: 0; right: 0; height: 862px; pointer-events: none;
    background:
      linear-gradient(90deg, #000 0%, rgba(0,0,0,0.92) 26%, rgba(0,0,0,0.35) 58%, rgba(0,0,0,0) 80%),
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, #000 100%);
  }

  /* Barre du haut */
  .top { position: absolute; top: 48px; left: 120px; right: 120px; height: 64px; display: flex; align-items: center; z-index: 5; }
  .tabs { display: flex; gap: 6px; padding: 6px; border-radius: 20px; background: rgba(0,0,0,0.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .tab { padding: 12px 26px; border-radius: 14px; font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.62); transition: background-color 160ms ease, color 160ms ease; }
  .tab.is-current { color: #fff; background: rgba(255,255,255,0.14); }
  .tab.is-focused { color: #000; background: #fff; }
  .clock { margin-left: auto; text-align: right; }
  .clock .t { font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
  .clock .d { font-size: 18px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  /* Défilement vertical de la page */
  .page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .stack { transition: transform 420ms var(--ease); }

  .hero-text { padding: 178px 120px 0; height: 628px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.75); }
  .eyebrow svg { font-size: 28px; }
  .title { margin-top: 14px; font-size: 120px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; }
  .hero-text .chips { margin-top: 22px; }
  .sub { margin-top: 18px; font-size: 28px; line-height: 1.4; color: rgba(255,255,255,0.78); max-width: 1000px; white-space: nowrap; }
  .actions { margin-top: 30px; display: flex; gap: 18px; }
  .anim { animation: rise 520ms var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .hero-art, .hero-mask { transition: opacity 500ms ease; }
  .top { transition: opacity 300ms ease, transform 300ms var(--ease); }
  .topfade { position: absolute; top: 0; left: 0; right: 0; height: 200px; z-index: 4; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, #000 30%, rgba(0,0,0,0)); transition: opacity 300ms ease; }
  .is-scrolled .hero-art { opacity: 0.32; }
  .is-scrolled .top { opacity: 0; transform: translateY(-24px); }
  .is-scrolled .topfade { opacity: 1; }

  .shelf { padding: 0 120px 50px; }
  .shelf h2 { font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.85); margin: 0 0 22px; letter-spacing: -0.01em; }
  .shelf h2 small { font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.45); margin-left: 12px; }
  .row { display: flex; gap: 36px; }
  .tile { flex: 0 0 auto; }
  .xl .card { width: 400px; height: 225px; }
  .md .card { width: 300px; height: 169px; border-radius: 18px; }
  .md .card .name { font-size: 22px; left: 18px; bottom: 14px; }
</style>
</head>
<body>
  <div class="hero-art" data-bind="art"></div>
  <div class="hero-mask"></div>

  <div class="top">
    <div class="tabs">
      <div class="tab is-current" data-f data-keep>Accueil</div>
      <div class="tab" data-f data-keep>Jeux</div>
      <div class="tab" data-f data-keep>Streaming</div>
      <div class="tab" data-f data-keep>Apps</div>
    </div>
    <div class="clock"><div class="t" data-clock="time"></div><div class="d" data-clock="date"></div></div>
  </div>

  <div class="page">
    <div class="stack">
      <section class="hero-text">
        <div id="heroCopy">
          <div class="eyebrow"><span id="kindIcon"></span><span data-bind="kind"></span></div>
          <div class="title" data-bind="title"></div>
          <div class="chips" data-bind="meta"></div>
          <div class="sub" data-bind="sub"></div>
        </div>
        <div class="actions">
          <div class="btn primary" data-f data-keep data-title="Ouvrir"><span data-icon="play"></span>Ouvrir</div>
          <div class="btn" data-f data-keep data-title="Ajouter aux favoris"><span data-icon="plus"></span>Favori</div>
        </div>
      </section>

      <section class="shelf xl">
        <h2>Jouer <small>Cloud gaming</small></h2>
        <div class="row">
          <div class="tile" data-f data-start data-app="luna" data-card></div>
          <div class="tile" data-f data-app="xbox" data-card></div>
          <div class="tile" data-f data-app="gaminghub" data-card></div>
          <div class="tile" data-f data-app="geforce" data-card></div>
        </div>
      </section>

      <section class="shelf md">
        <h2>Regarder</h2>
        <div class="row">
          <div class="tile" data-f data-app="netflix" data-card></div>
          <div class="tile" data-f data-app="youtube" data-card></div>
          <div class="tile" data-f data-app="canal" data-card></div>
          <div class="tile" data-f data-app="crunchyroll" data-card></div>
          <div class="tile" data-f data-app="prime" data-card></div>
        </div>
      </section>

      <section class="shelf md">
        <h2>TV Hub</h2>
        <div class="row">
          <div class="tile" data-f data-app="apps" data-card></div>
          <div class="tile" data-f data-app="home" data-card></div>
        </div>
      </section>
    </div>
  </div>

  <div class="topfade"></div>
  <div class="grain"></div>
  <div class="toast" id="toast"></div>
  <div class="label-maquette">Maquette 1 · Cinéma</div>
  <script src="art.js"></script>
  <script src="maquette.js"></script>
  <script>
    // Les boutons et onglets gardent l'app affichée ; seules les tuiles changent la bannière.
    var stack = document.querySelector('.stack'), copy = document.getElementById('heroCopy');
    document.addEventListener('maquette:focus', function (e) {
      var n = e.detail;
      if (n.hasAttribute('data-app')) {
        copy.classList.remove('anim'); void copy.offsetWidth; copy.classList.add('anim');
        var k = n.dataset.kind;
        document.getElementById('kindIcon').innerHTML = TVArt.icon(k === 'Jeux' ? 'pad' : k === 'Streaming' ? 'tv' : 'grid');
      }
      // Rangée Jouer ou au-dessus : page en haut ; plus bas : la page monte.
      var sec = n.closest('.shelf');
      var y = 0;
      var deep = !!(sec && sec !== document.querySelectorAll('.shelf')[0]);
      if (deep) y = -(sec.offsetTop - 150);
      document.body.classList.toggle('is-scrolled', deep);
      stack.style.transform = 'translate3d(0,' + y + 'px,0)';
    });
  </script>
</body>
</html>
