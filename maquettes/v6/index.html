<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>TV-hub V6</title>
<link rel="stylesheet" href="hub.css">
<script>
  // Simulation Tizen de développement (jamais en production) : ?scenario=default|full|listfail
  if (/[?&]scenario=/.test(location.search)) document.write('<script src="../../dev/tizen-mock.js"><\/script>');
</script>
<!-- Clé TMDB personnelle (fichier ignoré par git). Absente : TMDB désactivé proprement. -->
<script src="key.js"></script>
<script src="../../app/js/platform.js"></script>
<script src="../../app/js/catalog.js"></script>
<script src="../../app/js/nav.js"></script>
<script src="../../app/js/widgets.js"></script>
<script src="tmdb.js"></script>
</head>
<body>
<div id="stage">
  <div class="bd" id="bdA"></div><div class="bd" id="bdB"></div>
  <div class="shade"></div>

  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="status"><span id="wx">Météo…</span><span id="date"></span><span class="clock" id="clock"></span></div>
  </div>

  <div class="hero" id="hero">
    <div class="kicker" id="kicker"></div>
    <div class="htitle" id="htitle"></div>
    <div class="meta" id="meta"></div>
    <div class="overview" id="overview"></div>
    <div class="action" id="action"><span class="ok" id="actOk">OK</span><span id="actText"></span></div>
    <div class="note" id="note"></div>
  </div>

  <div class="rowsview"><div class="rows" id="rows"></div></div>

  <div class="credit">Données et images : TMDB · disponibilités : JustWatch — ce produit utilise l’API TMDB sans être approuvé ni certifié par TMDB</div>

  <div class="veil" id="veil"><div class="sheet"><h2 id="shTitle"></h2><div class="body" id="shBody"></div><input class="field" id="shInput" type="text" maxlength="40" autocomplete="off" hidden><div class="btn">OK</div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="hub.js"></script>
</body>
</html>
